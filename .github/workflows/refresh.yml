name: Refresh data

on:
  schedule:
    - cron: "45 6 * * *"   # daily 06:45 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - run: python pipeline/fetch.py
      - name: Commit if data changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/holdings.csv
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +%F)"
          git push
